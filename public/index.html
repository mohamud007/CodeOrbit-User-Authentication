
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOrbit | User Authentication</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
        }

        .tabs button {
            flex: 1;
            background: #e2e8f0;
        }

        .tabs button.active,
        .primary {
            background: #2563eb;
            color: white;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

.password-wrapper {
    position: relative;
    width: 100%;
}

.password-wrapper input {
    width: 100%;
    padding-right: 48px;
    box-sizing: border-box;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    padding: 4px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
}

.toggle-password:hover {
    background: transparent;
}


        .primary {
            width: 100%;
            margin-top: 20px;
        }

        .secondary {
            width: 100%;
            margin-top: 10px;
            background: #e2e8f0;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #f1f5f9;
            overflow-wrap: anywhere;
        }

       
/* Profile dashboard heading */
#dashboard h2 {
    margin: 24px 0 18px;
    font-size: 22px;
    font-weight: 700;
    color: #0f172a;
}

/* Profile information card */
.profile {
    margin-top: 16px;
    padding: 22px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow-wrap: anywhere;
}

/* Profile information spacing */
.profile p {
    margin: 0 0 16px;
    line-height: 1.6;
    font-size: 15px;
    color: #334155;
}

.profile p:last-child {
    margin-bottom: 0;
}

/* Dashboard buttons */
#dashboard button {
    min-height: 46px;
    font-weight: 600;
    transition: background 0.2s ease, transform 0.2s ease;
}

#dashboard .primary:hover {
    background: #1d4ed8;
}

#dashboard .secondary:hover {
    background: #cbd5e1;
}

#dashboard button:active {
    transform: scale(0.99);
}

    </style>
</head>

<body>
    <main class="container">
        <h1>Authentication</h1>

        <div class="tabs" id="tabs">
            <button id="signupTab" class="active" type="button">
                Sign Up
            </button>
            <button id="loginTab" type="button">
                Log In
            </button>
        </div>

        <form id="authForm">
            <div id="nameGroup">
                <label for="name">Full name</label>
                <input
                    id="name"
                    name="name"
                    type="text"
                    maxlength="100"
                    autocomplete="name"
                    required
                >
            </div>

            <label for="email">Email address</label>
            <input
                id="email"
                name="email"
                type="email"
                maxlength="255"
                autocomplete="email"
                required
            >

            
<label for="password">Password</label>
<div class="password-wrapper">
    <input
        id="password"
        name="password"
        type="password"
        minlength="12"
        autocomplete="current-password"
        required
    >

    <button
        type="button"
        id="togglePassword"
        class="toggle-password"
        aria-label="Show password"
        aria-pressed="false"
    >
        👁
    </button>
</div>


            <button class="primary" id="submitButton" type="submit">
                Create Account
            </button>
        </form>

        <section id="dashboard" class="hidden">
            <h2>Your Profile</h2>
            <div id="profileData" class="profile">
                Click the button below to load your profile.
            </div>

            <button class="primary" id="profileButton" type="button">
                Load My Profile
            </button>

            <button class="secondary" id="logoutButton" type="button">
                Log Out
            </button>
        </section>

        <div
            id="message"
            class="message hidden"
            role="status"
            aria-live="polite"
        ></div>
    </main>

    <script>
        const authForm = document.getElementById("authForm");
        const nameGroup = document.getElementById("nameGroup");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {
    const isPasswordHidden = passwordInput.type === "password";

    passwordInput.type = isPasswordHidden ? "text" : "password";

    togglePassword.textContent = isPasswordHidden ? "👁" : "👁";

    togglePassword.setAttribute(
        "aria-label",
        isPasswordHidden ? "Hide password" : "Show password"
    );

    togglePassword.setAttribute(
        "aria-pressed",
        String(isPasswordHidden)
    );
});

        const signupTab = document.getElementById("signupTab");
        const loginTab = document.getElementById("loginTab");
        const submitButton = document.getElementById("submitButton");
        const tabs = document.getElementById("tabs");
        const dashboard = document.getElementById("dashboard");
        const message = document.getElementById("message");
        const profileData = document.getElementById("profileData");

        let currentMode = "signup";

        function showMessage(text) {
            message.textContent = text;
            message.classList.remove("hidden");
        }

        function hideMessage() {
            message.textContent = "";
            message.classList.add("hidden");
        }

        function setMode(mode) {
            currentMode = mode;
            authForm.reset();
            hideMessage();

            nameGroup.classList.toggle("hidden", mode === "login");
            nameInput.required = mode === "signup";

            signupTab.classList.toggle("active", mode === "signup");
            loginTab.classList.toggle("active", mode === "login");

            submitButton.textContent =
                mode === "signup" ? "Create Account" : "Log In";

            passwordInput.autocomplete =
                mode === "signup" ? "new-password" : "current-password";
        }

        signupTab.addEventListener("click", () => setMode("signup"));
        loginTab.addEventListener("click", () => setMode("login"));

        authForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            hideMessage();

            const payload = {
                email: emailInput.value,
                password: passwordInput.value
            };

            if (currentMode === "signup") {
                payload.name = nameInput.value;
            }

            submitButton.disabled = true;

            try {
                const response = await fetch(
                    `/api/auth/${currentMode}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "same-origin",
                        body: JSON.stringify(payload)
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.message || "Request failed");
                    return;
                }

                if (currentMode === "signup") {
                    showMessage(
                        "Account created! Please log in with your credentials."
                    );
                    setMode("login");
                    return;
                }

                authForm.classList.add("hidden");
                tabs.classList.add("hidden");
                dashboard.classList.remove("hidden");

                passwordInput.value = "";
                showMessage("Login successful!");
                await loadProfile();
            } catch (error) {
                showMessage(
                    "Could not connect to the server. Please try again."
                );
            } finally {
                submitButton.disabled = false;
            }
        });

        async function loadProfile() {
    try {
        const response = await fetch("/api/auth/profile", {
            credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "Could not load profile");
            return;
        }

        const user = data.user;

        profileData.replaceChildren();

        const heading = document.createElement("p");
        heading.textContent = "Profile details";
        profileData.append(heading);

        function addProfileField(label, value) {
            const row = document.createElement("p");

            const labelElement = document.createElement("strong");
            labelElement.textContent = `${label}: `;

            const valueElement = document.createElement("span");
            valueElement.textContent = value ?? "";

            row.append(labelElement, valueElement);
            return row;
        }

        profileData.append(
            addProfileField("Name", user.name),
            addProfileField("Email", user.email),
            addProfileField("User ID", user.id)
        );

        if (user.created_at) {
            const created = document.createElement("p");

            const createdLabel = document.createElement("strong");
            createdLabel.textContent = "Account Created: ";

            const createdValue = document.createElement("span");
            createdValue.textContent =
                new Date(user.created_at).toLocaleString();

            created.append(createdLabel, createdValue);
            profileData.append(created);
        }
    } catch (error) {
        showMessage("Could not load profile. Try again.");
    }
}
        document.getElementById("profileButton")
            .addEventListener("click", loadProfile);

        document.getElementById("logoutButton")
            .addEventListener("click", async () => {
                hideMessage();

                try {
                    const response = await fetch("/api/auth/logout", {
                        method: "POST",
                        credentials: "same-origin"
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        showMessage(data.message || "Logout failed");
                        return;
                    }

                    dashboard.classList.add("hidden");
                    authForm.classList.remove("hidden");
                    tabs.classList.remove("hidden");

                    setMode("login");
                    showMessage("You have logged out successfully.");
                } catch (error) {
                    showMessage("Could not log out. Please try again.");
                }
            });
    </script>
</body>
</html>
